<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" role="img" aria-labelledby="title desc">
  <title id="title">How the Bash risk evaluation worked</title>
  <desc id="desc">Twelve natural-language coding tasks went to a coding agent that chose its own commands in disposable sandboxes. Recorded tool calls and outcomes yielded 31 Bash spans, evaluated one command at a time. The same evidence and attempted-risk rubric went to Jev, Gemini 2.5 Flash Lite, and GPT-5 nano. Their risk labels, response times, and available explanations were compared. This was an offline comparison without independent ground-truth labels.</desc>
  <defs>
    <style>
      .sans { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .ink { fill: #252523; }
      .brown { fill: #341a10; }
      .white { fill: #fffdfb; }
      .arrow { fill: none; stroke: #37312e; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <marker id="head" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 1.5 1.5 L 10.5 6 L 1.5 10.5" fill="none" stroke="#37312e" stroke-width="1.8" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1600" height="800" fill="#fffdfb"/>

  <!-- Roomy column groups follow the visual reference; the content is this experiment's own. -->
  <rect x="30" y="28" width="340" height="744" rx="21" fill="#ffffff" stroke="#2f3134" stroke-width="1.7"/>
  <rect x="50" y="48" width="300" height="704" rx="17" fill="none" stroke="#ee947b" stroke-width="1.5" stroke-dasharray="8 7"/>
  <rect x="400" y="28" width="465" height="744" rx="21" fill="#ffffff" stroke="#2f3134" stroke-width="1.7"/>
  <rect x="420" y="48" width="425" height="704" rx="17" fill="none" stroke="#d6c8bb" stroke-width="1.5" stroke-dasharray="8 7"/>
  <rect x="895" y="28" width="675" height="744" rx="21" fill="#ffffff" stroke="#2f3134" stroke-width="1.7"/>
  <rect x="915" y="48" width="635" height="704" rx="17" fill="none" stroke="#a8cbe9" stroke-width="1.5" stroke-dasharray="8 7"/>

  <rect x="70" y="70" width="132" height="47" rx="7" fill="#ee947b"/>
  <text x="88" y="102" class="mono ink" font-size="25" font-weight="700">INPUTS</text>
  <rect x="440" y="70" width="198" height="47" rx="7" fill="#f1ebe4"/>
  <text x="458" y="102" class="mono ink" font-size="25" font-weight="700">AGENT WORK</text>
  <rect x="935" y="70" width="194" height="47" rx="7" fill="#cbe2f5"/>
  <text x="953" y="102" class="mono ink" font-size="25" font-weight="700">EVALUATION</text>

  <!-- Cross-column and within-column flow connectors. -->
  <path d="M 325 425 H 385 V 265 H 430" class="arrow" marker-end="url(#head)"/>
  <path d="M 632 360 V 424" class="arrow" marker-end="url(#head)"/>
  <path d="M 820 512 H 905 V 320 H 930" class="arrow" marker-end="url(#head)"/>
  <path d="M 1225 370 V 394 H 955 V 624" class="arrow"/>
  <path d="M 955 464 H 965" class="arrow" marker-end="url(#head)"/>
  <path d="M 955 544 H 965" class="arrow" marker-end="url(#head)"/>
  <path d="M 955 624 H 965" class="arrow" marker-end="url(#head)"/>
  <path d="M 1495 464 H 1520 V 672 H 1240 V 676" class="arrow" marker-end="url(#head)"/>
  <path d="M 1495 544 H 1520" class="arrow"/>
  <path d="M 1495 624 H 1520" class="arrow"/>

  <!-- Inputs -->
  <rect x="76" y="330" width="249" height="190" rx="15" fill="#fbf6f0" stroke="#302e2c" stroke-width="1.8"/>
  <text x="100" y="388" class="sans ink" font-size="26" font-weight="750">12 coding tasks</text>
  <text x="100" y="439" class="sans ink" font-size="23">Natural-language</text>
  <text x="100" y="471" class="sans ink" font-size="23">instructions</text>

  <!-- Agent work -->
  <rect x="445" y="170" width="375" height="190" rx="15" fill="#341a10"/>
  <text x="474" y="223" class="sans white" font-size="31" font-weight="750">Coding agent</text>
  <text x="474" y="266" class="sans white" font-size="23">Chooses its own commands</text>
  <text x="474" y="311" class="sans white" font-size="21">Disposable sandbox records</text>
  <text x="474" y="341" class="sans white" font-size="21">tool calls and outcomes</text>

  <rect x="445" y="440" width="375" height="145" rx="15" fill="#fbf6f0" stroke="#302e2c" stroke-width="1.8"/>
  <text x="474" y="489" class="sans ink" font-size="30" font-weight="750">31 Bash spans</text>
  <text x="474" y="526" class="sans ink" font-size="22">Selected from recorded calls</text>
  <text x="474" y="556" class="sans ink" font-size="22">One command at a time</text>

  <!-- Shared input and judges -->
  <rect x="945" y="270" width="565" height="100" rx="15" fill="#e4f1fd" stroke="#302e2c" stroke-width="1.8"/>
  <text x="970" y="311" class="sans ink" font-size="27" font-weight="750">Same evidence + risk rubric</text>
  <text x="970" y="346" class="sans ink" font-size="21">Attempted risk · low / medium / high / critical</text>

  <rect x="980" y="430" width="515" height="68" rx="13" fill="#e4f1fd" stroke="#302e2c" stroke-width="1.6"/>
  <text x="1004" y="458" class="sans ink" font-size="25" font-weight="750">Jev</text>
  <text x="1004" y="484" class="sans ink" font-size="18">Typed choice + probabilities</text>

  <rect x="980" y="510" width="515" height="68" rx="13" fill="#e4f1fd" stroke="#302e2c" stroke-width="1.6"/>
  <text x="1004" y="538" class="sans ink" font-size="25" font-weight="750">Gemini 2.5 Flash Lite</text>
  <text x="1004" y="564" class="sans ink" font-size="18">Risk label + rationale</text>

  <rect x="980" y="590" width="515" height="68" rx="13" fill="#e4f1fd" stroke="#302e2c" stroke-width="1.6"/>
  <text x="1004" y="618" class="sans ink" font-size="25" font-weight="750">GPT-5 nano</text>
  <text x="1004" y="644" class="sans ink" font-size="18">Risk label + rationale</text>

  <rect x="980" y="688" width="515" height="53" rx="13" fill="#cbe2f5" stroke="#302e2c" stroke-width="1.6"/>
  <text x="1004" y="721" class="sans ink" font-size="23" font-weight="750">Compare labels, latency, explanations</text>
</svg>
