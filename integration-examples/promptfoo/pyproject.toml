[project]
name = "promptfoo-fiddler-redteam"
version = "0.1.0"
description = "Bridge promptfoo-generated red-team prompts into Fiddler Datasets and Experiments to score guardrail detection of safety and PII attacks."
requires-python = ">=3.11"
dependencies = [
    "fiddler-evals>=0.7.0rc1,<0.8",
    "requests>=2.31",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
promptfoo-fiddler-redteam = "promptfoo_fiddler_redteam.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
